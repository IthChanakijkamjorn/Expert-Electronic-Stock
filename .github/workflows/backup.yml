name: Backup

on:
  schedule:
    - cron: "0 20 * * *" # 03:00 Thailand time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database and download files
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p work/files
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage -Fc -f work/database.dump
          node scripts/backup-files.mjs work/files

      - name: Encrypt and upload
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          tar -C work -cf - database.dump files | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "backup-$day.tar.gpg"
          aws s3 cp "backup-$day.tar.gpg" "s3://$R2_BUCKET/backups/backup-$day.tar.gpg" --endpoint-url "$R2_ENDPOINT"

      - name: Delete backups older than 30 days
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '30 days ago' +%F)
          aws s3 ls "s3://$R2_BUCKET/backups/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | while read -r f; do
            d=${f#backup-}; d=${d%.tar.gpg}
            if [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$d" < "$cutoff" ]]; then
              aws s3 rm "s3://$R2_BUCKET/backups/$f" --endpoint-url "$R2_ENDPOINT"
            fi
          done
